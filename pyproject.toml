[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gcheck"
version = "0.1.0"
description = "Troubleshooting Tool for Google Developers — helps developers diagnose network issues connecting to Google APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Google LLC" }]
keywords = ["network", "diagnostics", "google", "gemini", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0,<9",
    "textual>=0.80,<1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
gcheck = "gcheck.__main__:main"

[project.urls]
Homepage = "https://github.com/google/dev-env-troubleshoot"
Repository = "https://github.com/google/dev-env-troubleshoot"
Issues = "https://github.com/google/dev-env-troubleshoot/issues"

[tool.hatch.build.targets.wheel]
packages = ["gcheck"]

[tool.pytest.ini_options]
testpaths = ["unit_test"]
asyncio_mode = "auto"
